global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    instance: srv1408380

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: node
    static_configs:
      - targets: [node-exporter:9100]
        labels: { vps: srv1408380 }

  - job_name: paperclipai
    metrics_path: /api/metrics
    scrape_interval: 60s
    static_configs:
      - targets: [paperclip:8000]
        labels: { service: paperclipai }

  - job_name: paddleocr
    metrics_path: /metrics
    scrape_interval: 60s
    static_configs:
      - targets: [paddleocr-service:4006]
        labels: { service: paddleocr }

  - job_name: bedrock-proxy
    metrics_path: /metrics
    scrape_interval: 60s
    static_configs:
      - targets: [bedrock-proxy:4002]
        labels: { service: bedrock-proxy }

  # Add per-client VPS targets here as new clients onboard (or use file_sd / DNS SD).
