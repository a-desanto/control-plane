services:
  unstructured-api:
    image: quay.io/unstructured-io/unstructured-api:latest
    container_name: unstructured-api
    restart: unless-stopped
    environment:
      LOG_LEVEL: INFO
      OMP_NUM_THREADS: "2"
      UNSTRUCTURED_API_KEY: ${UNSTRUCTURED_API_KEY}
    volumes:
      - /data/cfpa-volumes/unstructured/cache:/root/.cache
      - /data/cfpa-volumes/unstructured/nltk_data:/root/nltk_data
    expose:
      - "8000"
    networks:
      - coolify
    deploy:
      resources:
        limits:
          memory: 4G
    labels:
      traefik.enable: "true"
      traefik.docker.network: "coolify"
      traefik.http.routers.http-0-unstructured.entryPoints: "http"
      traefik.http.routers.http-0-unstructured.middlewares: "redirect-to-https"
      traefik.http.routers.http-0-unstructured.rule: "Host(`extract.cfpa.sekuirtek.com`) && PathPrefix(`/`)"
      traefik.http.routers.http-0-unstructured.service: "http-0-unstructured"
      traefik.http.routers.https-0-unstructured.entryPoints: "https"
      traefik.http.routers.https-0-unstructured.middlewares: "gzip"
      traefik.http.routers.https-0-unstructured.rule: "Host(`extract.cfpa.sekuirtek.com`) && PathPrefix(`/`)"
      traefik.http.routers.https-0-unstructured.service: "https-0-unstructured"
      traefik.http.routers.https-0-unstructured.tls: "true"
      traefik.http.routers.https-0-unstructured.tls.certresolver: "letsencrypt"
      traefik.http.services.http-0-unstructured.loadbalancer.server.port: "8000"
      traefik.http.services.https-0-unstructured.loadbalancer.server.port: "8000"

networks:
  coolify:
    external: true
    name: coolify
