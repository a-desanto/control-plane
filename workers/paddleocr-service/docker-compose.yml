services:
  paddleocr-service:
    build:
      context: workers/paddleocr-service
    image: paddleocr-service:latest
    container_name: paddleocr-service
    restart: always
    networks:
      - coolify
    environment:
      - PADDLE_HOME=/app/models
    volumes:
      - /data/cfpa-volumes/paddleocr-service/models:/app/models
    # Internal only — no Traefik labels. Other services reach it via
    # http://paddleocr-service:4006 on the coolify network.
    expose:
      - "4006"

networks:
  coolify:
    external: true
    name: coolify
