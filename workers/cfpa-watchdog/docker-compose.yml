services:
  cfpa-watchdog:
    build:
      context: workers/cfpa-watchdog
    image: cfpa-watchdog:latest
    container_name: cfpa-watchdog
    restart: unless-stopped
    networks:
      - coolify
    environment:
      - PAPERCLIP_API_URL=${PAPERCLIP_API_URL}
      - PAPERCLIP_API_KEY=${PAPERCLIP_API_KEY}
      - PAPERCLIP_COMPANY_ID=${PAPERCLIP_COMPANY_ID}
      - LANGFUSE_HOST=${LANGFUSE_HOST}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - HEALTHCHECK_PING_URL=${HEALTHCHECK_PING_URL}
      - WATCHDOG_AGENT_513f5d7f_aba3_43fe_9d97_25a22fb3cc2e_PER_HOUR_MAX_USD=${WATCHDOG_AGENT_513f5d7f_aba3_43fe_9d97_25a22fb3cc2e_PER_HOUR_MAX_USD}
      - WATCHDOG_AGENT_e3e191c3_b7d4_4d2d_bfe4_2709db3b76a2_PER_HOUR_MAX_USD=${WATCHDOG_AGENT_e3e191c3_b7d4_4d2d_bfe4_2709db3b76a2_PER_HOUR_MAX_USD}
      - WATCHDOG_AGENT_b512de5c_ea5a_4146_8aaa_750bba2846c7_PER_HOUR_MAX_USD=${WATCHDOG_AGENT_b512de5c_ea5a_4146_8aaa_750bba2846c7_PER_HOUR_MAX_USD}
      - WATCHDOG_AGENT_535d320c_8eef_4f2c_a3b9_9d94c2f99793_PER_HOUR_MAX_USD=${WATCHDOG_AGENT_535d320c_8eef_4f2c_a3b9_9d94c2f99793_PER_HOUR_MAX_USD}
    # No ports — pure background poller

networks:
  coolify:
    external: true
    name: coolify
